<!doctype html>
<html>
<head><meta charset="utf-8"><title>text GPU compositor harness</title></head>
<body>
<!--
  text-gpu-test.html — self-contained WebGPU harness proving the text pipeline
  produces REAL GPU pixels in the browser: it loads the shared text_engine.wasm,
  lays out a spec, then runs the host text.render compositor (compute) on real
  WebGPU and reads the pixels back. A puppeteer driver (web/test-tools/
  text_gpu_dump.mjs) navigates here, calls window.renderTextGPU(spec), grabs
  #result, writes a PNG, and compares against the CPU golden reference.

  This is intentionally standalone (not yet wired through the effect graph /
  text.* ABI) so the GPU compositor can be validated on real WebGPU before the
  full host integration.
-->
<pre id="result">pending</pre>
<script type="module">
const ATLAS_RGBA_OFFSET_ALPHA = 24; // alpha in high byte of LE-packed RGBA8

// Hand-authored WGSL mirroring native/src/text/shaders/text_composite.hlsl
// (the production web path will auto-generate this from the HLSL via naga).
const WGSL = `
struct Glyph { rect: vec4<f32>, uv: vec4<f32>, rgba: vec4<f32> };
struct U {
  canvas_w:u32, canvas_h:u32, glyph_count:u32, atlas_w:u32, atlas_h:u32,
  origin_x:f32, origin_y:f32, atlas_kind:u32, atlas_px_range:f32,
  _p0:f32, _p1:f32, _p2:f32,
};
@group(0) @binding(0) var<storage, read> glyphs: array<Glyph>;
@group(0) @binding(1) var<storage, read> atlas: array<u32>;
@group(0) @binding(2) var bg_tex: texture_2d<f32>;
@group(0) @binding(3) var samp: sampler;
@group(0) @binding(4) var out_tex: texture_storage_2d<rgba8unorm, write>;
@group(0) @binding(5) var<uniform> u: U;

fn median3(a:f32, b:f32, c:f32) -> f32 { return max(min(a,b), min(max(a,b), c)); }

// Nearest-fetch a packed RGBA8 texel (LE: R=low byte).
fn atlas_texel(uu:f32, vv:f32) -> vec4<f32> {
  let tx = clamp(i32(uu * f32(u.atlas_w)), 0, i32(u.atlas_w) - 1);
  let ty = clamp(i32(vv * f32(u.atlas_h)), 0, i32(u.atlas_h) - 1);
  let p = atlas[ty * i32(u.atlas_w) + tx];
  return vec4<f32>(f32(p & 0xFFu), f32((p>>8u)&0xFFu), f32((p>>16u)&0xFFu), f32((p>>24u)&0xFFu)) / 255.0;
}

@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) gid: vec3<u32>) {
  if (gid.x >= u.canvas_w || gid.y >= u.canvas_h) { return; }
  let p = vec2<f32>(f32(gid.x) + 0.5, f32(gid.y) + 0.5);
  let bg_uv = p / vec2<f32>(f32(u.canvas_w), f32(u.canvas_h));
  var col = textureSampleLevel(bg_tex, samp, bg_uv, 0.0).rgb;
  for (var i:u32 = 0u; i < u.glyph_count; i = i + 1u) {
    let g = glyphs[i];
    let gx = g.rect.x + u.origin_x;
    let gy = g.rect.y + u.origin_y;
    if (p.x < gx || p.y < gy || p.x >= gx + g.rect.z || p.y >= gy + g.rect.w) { continue; }
    let lu = (p.x - gx) / g.rect.z;
    let lv = (p.y - gy) / g.rect.w;
    let au = g.uv.x + lu * (g.uv.z - g.uv.x);
    let av = g.uv.y + lv * (g.uv.w - g.uv.y);
    let texel = atlas_texel(au, av);
    var cov: f32;
    if (u.atlas_kind == 0u) {                    // MSDF: median + screenPxRange AA
      let tile_h_px = (g.uv.w - g.uv.y) * f32(u.atlas_h);
      let spr = select(1.0, u.atlas_px_range * g.rect.w / tile_h_px, tile_h_px > 0.0);
      let sd = median3(texel.r, texel.g, texel.b);
      cov = clamp(spr * (sd - 0.5) + 0.5, 0.0, 1.0);
    } else {
      cov = texel.a;                             // alpha-coverage (stub atlas)
    }
    let a = cov * g.rgba.a;
    col = g.rgba.rgb * a + col * (1.0 - a);
  }
  textureStore(out_tex, vec2<i32>(gid.xy), vec4<f32>(col, 1.0));
}`;

let engine = null;
async function loadEngine() {
  if (engine) return engine;
  const bytes = await (await fetch('/wasm/text_engine.wasm')).arrayBuffer();
  const mod = await WebAssembly.compile(bytes);
  // Generic no-op stubs for every import (wasi + the unused env setjmp/longjmp
  // FreeType references but never calls).
  const importObject = {};
  for (const i of WebAssembly.Module.imports(mod)) {
    (importObject[i.module] ??= {});
    if (i.kind === 'function') importObject[i.module][i.name] = () => 0;
  }
  const instance = await WebAssembly.instantiate(mod, importObject);
  instance.exports.__wasm_call_ctors?.();
  engine = instance.exports;
  return engine;
}

let gpu = null;
async function getDevice() {
  if (gpu) return gpu;
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();
  const pipeline = device.createComputePipeline({
    layout: 'auto',
    compute: { module: device.createShaderModule({ code: WGSL }), entryPoint: 'main' },
  });
  gpu = { device, pipeline };
  return gpu;
}

window.renderTextGPU = async (spec, fontUrl) => {
  const ex = await loadEngine();
  const { device, pipeline } = await getDevice();

  // Install the font (served bytes — same file the CPU reference reads).
  const fontBytes = new Uint8Array(await (await fetch(fontUrl || '/wasm/testfont.ttf')).arrayBuffer());
  const fptr = ex.malloc(fontBytes.length);
  new Uint8Array(ex.memory.buffer).set(fontBytes, fptr);
  if (!ex.te_set_font(fptr, fontBytes.length)) throw new Error('te_set_font failed');
  ex.free(fptr);

  // --- CPU engine: layout → metrics → glyphs → atlas ---
  const enc = new TextEncoder().encode(spec);
  const specPtr = ex.malloc(enc.length);
  new Uint8Array(ex.memory.buffer).set(enc, specPtr);
  const id = ex.te_layout(specPtr, enc.length);
  ex.free(specPtr);
  if (id <= 0) throw new Error('layout failed');

  const mPtr = ex.malloc(32);
  ex.te_measure(id, mPtr);
  const dv = new DataView(ex.memory.buffer);
  const width = dv.getFloat32(mPtr + 0, true);
  const height = dv.getFloat32(mPtr + 4, true);
  const atlasKind = dv.getInt32(mPtr + 20, true);
  const atlasPxRange = dv.getFloat32(mPtr + 24, true);
  ex.free(mPtr);

  const MARGIN = 16;
  const cw = Math.max(1, Math.ceil(width) + 2 * MARGIN);
  const ch = Math.max(1, Math.ceil(height) + 2 * MARGIN);

  const count = ex.te_glyph_count(id);
  const gPtr = ex.malloc(count * 48);
  const written = ex.te_glyphs(id, gPtr, count * 48);
  const glyphBytes = new Uint8Array(ex.memory.buffer.slice(gPtr, gPtr + written * 48));
  ex.free(gPtr);

  const aw = ex.te_atlas_width(), ah = ex.te_atlas_height();
  const aPtr = ex.te_atlas_ptr();
  const atlasBytes = new Uint8Array(ex.memory.buffer.slice(aPtr, aPtr + aw * ah * 4));
  ex.te_release(id);

  // --- GPU resources ---
  const glyphBuf = device.createBuffer({ size: Math.max(48, glyphBytes.byteLength), usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(glyphBuf, 0, glyphBytes);
  const atlasBuf = device.createBuffer({ size: atlasBytes.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(atlasBuf, 0, atlasBytes);

  const uni = new ArrayBuffer(48);
  const uv = new DataView(uni);
  uv.setUint32(0, cw, true); uv.setUint32(4, ch, true); uv.setUint32(8, written, true);
  uv.setUint32(12, aw, true); uv.setUint32(16, ah, true);
  uv.setFloat32(20, MARGIN, true); uv.setFloat32(24, MARGIN, true);
  uv.setUint32(28, atlasKind, true); uv.setFloat32(32, atlasPxRange, true);
  const uniBuf = device.createBuffer({ size: 48, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(uniBuf, 0, uni);

  // 1x1 opaque-black background (matches the CPU reference bg).
  const bgTex = device.createTexture({ size: [1, 1], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });
  device.queue.writeTexture({ texture: bgTex }, new Uint8Array([0, 0, 0, 255]), { bytesPerRow: 4 }, [1, 1]);
  const sampler = device.createSampler({ magFilter: 'nearest', minFilter: 'nearest' });

  const outTex = device.createTexture({ size: [cw, ch], format: 'rgba8unorm', usage: GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.COPY_SRC });

  const bind = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: glyphBuf } },
      { binding: 1, resource: { buffer: atlasBuf } },
      { binding: 2, resource: bgTex.createView() },
      { binding: 3, resource: sampler },
      { binding: 4, resource: outTex.createView() },
      { binding: 5, resource: { buffer: uniBuf } },
    ],
  });

  const enc2 = device.createCommandEncoder();
  const pass = enc2.beginComputePass();
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, bind);
  pass.dispatchWorkgroups(Math.ceil(cw / 8), Math.ceil(ch / 8));
  pass.end();

  // Readback (bytesPerRow padded to 256).
  const bpr = Math.ceil(cw * 4 / 256) * 256;
  const readBuf = device.createBuffer({ size: bpr * ch, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  enc2.copyTextureToBuffer({ texture: outTex }, { buffer: readBuf, bytesPerRow: bpr }, [cw, ch]);
  device.queue.submit([enc2.finish()]);
  await readBuf.mapAsync(GPUMapMode.READ);
  const padded = new Uint8Array(readBuf.getMappedRange());
  const tight = new Uint8Array(cw * ch * 4);
  for (let y = 0; y < ch; y++) tight.set(padded.subarray(y * bpr, y * bpr + cw * 4), y * cw * 4);
  readBuf.unmap();

  let b64 = '';
  for (let i = 0; i < tight.length; i += 0x8000) b64 += String.fromCharCode(...tight.subarray(i, i + 0x8000));
  return { width: cw, height: ch, glyphs: written, pixelsBase64: btoa(b64) };
};

// Auto-run when ?spec= is present (puppeteer drives this).
const params = new URLSearchParams(location.search);
if (params.has('spec')) {
  window.renderTextGPU(params.get('spec'), params.get('font') || undefined)
    .then((r) => { document.getElementById('result').textContent = JSON.stringify(r); })
    .catch((e) => { document.getElementById('result').textContent = 'ERROR: ' + e.message + '\n' + e.stack; });
}
</script>
</body>
</html>
