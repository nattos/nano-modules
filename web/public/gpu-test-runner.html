<!DOCTYPE html>
<html>
<head><title>GPU Test Runner</title></head>
<body>
<pre id="result">Waiting for test config...</pre>
<script type="module">
import { GPUHost } from '/src/gpu-host.ts';
import { WasmHost } from '/src/wasm-host.ts';
import { FusionDispatcher } from '/src/fusion-dispatcher.ts';
import { TextEngine } from '/src/text-engine.ts';

/*
 * Generic GPU module test runner.
 *
 * Config shape (single module):
 * {
 *   module: "gpu_test.wasm",
 *   width: 64, height: 64,
 *   params: [[0, 0.5], [1, 1.0]],
 *   ticks: 1,
 *   samplePoints: [[32,32]],
 *   inputColor: [r, g, b, a],  // optional: create solid input texture
 * }
 *
 * Config shape (chain):
 * {
 *   chain: [
 *     { module: "spinningtris.wasm", params: [[0, 0.5]], ticks: 5 },
 *     { module: "brightness_contrast.wasm", params: [[1, 0.25]] },
 *   ],
 *   width: 64, height: 64,
 *   samplePoints: [[32,32]],
 * }
 */

// This GPU test runner loads the `testonly.wasm` bundle, which contains
// every effect the integration tests rely on. Tests still name modules by
// the old standalone .wasm filename (e.g. "gpu_test.wasm") for back-compat;
// translate those to the corresponding registered effect ID inside the
// bundle.
const EFFECT_ID_BY_FILENAME = {
  'gpu_test.wasm': 'debug.gpu_test',
  'spinningtris.wasm': 'debug.spinningtris',
  'brightness_contrast.wasm': 'color.tone.brightness_contrast',
  'solid_color.wasm': 'source.solid_color',
  'video_blend.wasm': 'composite.blend',
  'env_lfo.wasm': 'mod.source.lfo',
  // Wave-1 + Wave-2 core effects.
  'bake_alpha.wasm': 'composite.bake_alpha',
  'curve.wasm': 'color.tone.curve',
  'exposure.wasm': 'color.tone.exposure',
  'color_temperature.wasm': 'color.temperature',
  'invert.wasm': 'color.invert',
  'posterize.wasm': 'color.posterize',
  'levels.wasm': 'color.tone.levels',
  'hsl.wasm': 'color.hsl',
  'color_space.wasm': 'color.color_space',
  'hue_basis.wasm': 'color.hue_basis',
  'saturate.wasm': 'color.saturate',
  'vibrance.wasm': 'color.vibrance',
  'vignette.wasm': 'filter.vignette',
  'blur.wasm': 'filter.blur.gaussian',
  'fast_blur.wasm': 'filter.blur.fast',
  'sharpen.wasm': 'filter.sharpen',
  'edges.wasm': 'filter.edges',
  'crop.wasm': 'warp.crop',
  'transform.wasm': 'warp.transform',
  'gradient.wasm': 'source.gradient',
  'grid.wasm': 'source.grid',
  'noise.wasm': 'source.noise',
  'auto_level.wasm': 'color.tone.auto_level',
  'twitch_mask.wasm': 'filter.glitch.twitch_mask',
  // Test-only fusion-aware mappers + generator (testonly bundle only).
  'fuse_add.wasm':   'debug.fuse_add',
  'fuse_mul.wasm':   'debug.fuse_mul',
  'fuse_solid.wasm': 'debug.fuse_solid',
  // Platform-feature smoke effects (testonly bundle only).
  'hdr_test.wasm': 'debug.hdr_test',
  'atomic_test.wasm': 'debug.atomic_test',
  'rw_storage_test.wasm': 'debug.rw_storage_test',
  'clear_copy_test.wasm': 'debug.clear_copy_test',
  'mrt_test.wasm': 'debug.mrt_test',
  'lut3d_test.wasm': 'debug.lut3d_test',
  // Lights bundle (com.nano.lights) — show effects.
  'strobe_channel.wasm': 'source.light.strobe_channel',
  'soft_glow.wasm': 'source.light.soft_glow',
  'dispersion.wasm': 'warp.dispersion',
  'plasma_beam_cannon.wasm': 'source.light.plasma_beam_cannon',
  'orthomod.wasm': 'source.light.orthomod',
  'bounce_resonator.wasm': 'source.light.bounce_resonator',
  'side_jet.wasm': 'source.light.side_jet',
  'motion_blobs.wasm': 'source.light.motion_blobs',
  'lights_sim.wasm': 'filter.lights_sim',
  'block_dehance.wasm': 'filter.glitch.block_dehance',
  'tingle_top.wasm': 'source.light.tingle_top',
  'chroma_wave.wasm': 'source.light.chroma_wave',

  // Legacy bundle (com.nano.legacy) — NanoGraph ports.
  'bicolor_grad.wasm': 'color.legacy.bicolor_grad',
  'glisten.wasm': 'filter.legacy.glisten',
  'double_chamber.wasm': 'source.legacy.double_chamber',
  'd_wave.wasm': 'warp.legacy.d_wave',
  'lut_collection.wasm': 'color.legacy.lut_collection',
  'zoom_scroller.wasm': 'warp.legacy.zoom_scroller',
  'subtle_blur.wasm': 'filter.legacy.subtle_blur',
  'sphr_blur.wasm': 'filter.legacy.sphr_blur',
};

function resolveEffectId(moduleName) {
  // Accept either an effect ID (e.g. "debug.gpu_test") or a legacy filename.
  if (EFFECT_ID_BY_FILENAME[moduleName]) return EFFECT_ID_BY_FILENAME[moduleName];
  if (moduleName.endsWith('.wasm')) {
    const bare = moduleName.replace(/\.wasm$/, '');
    return EFFECT_ID_BY_FILENAME[bare + '.wasm'] ?? bare;
  }
  return moduleName;
}

async function run() {
  const resultEl = document.getElementById('result');
  resultEl.textContent = 'Running...';

  const config = window.__gpuTestConfig || (() => {
    const p = new URLSearchParams(window.location.search);
    return {
      module: p.get('module') || 'gpu_test.wasm',
      width: parseInt(p.get('width') || '64'),
      height: parseInt(p.get('height') || '64'),
      params: JSON.parse(p.get('params') || '[]'),
      ticks: parseInt(p.get('ticks') || '0'),
      samplePoints: JSON.parse(p.get('samples') || '[]'),
    };
  })();

  const W = config.width || 64;
  const H = config.height || 64;

  try {
    const adapter = await navigator.gpu?.requestAdapter();
    if (!adapter) throw new Error('No GPU adapter');
    const device = await adapter.requestDevice();
    const captured = [];
    device.addEventListener?.('uncapturederror', e => {
      captured.push(String(e.error?.message || e.error));
    });
    window.__gpuTestErrors = captured;
    const format = 'rgba8unorm';
    const texUsage = GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING
                   | GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.COPY_SRC
                   | GPUTextureUsage.COPY_DST;

    const gpuHost = new GPUHost(device, format);

    // Initialize the shared text engine so effects using the text.* service
    // (e.g. source.text.plain) can render. Idempotent; safe even if unused.
    try { await TextEngine.init(device, { fontUrl: '/fonts/default.ttf' }); }
    catch (e) { console.warn('[gpu-test-runner] text engine init failed:', e); }

    // Fusion dispatcher used when the test config requests
    // force-on fusion mode — every per-step dispatch goes through the
    // composer so per-effect tests can verify byte-identity between
    // the standalone and fused paths.
    const fusionDispatcher = new FusionDispatcher(gpuHost);
    const fusionMode = config.fusionMode || 'auto';

    // Build chain: either explicit chain config, or single module
    const steps = config.chain || [{
      module: config.module,
      params: config.params,
      ticks: config.ticks,
    }];

    // Create textures for ping-pong between steps
    const texA = device.createTexture({ size: [W, H], format, usage: texUsage });
    const texB = device.createTexture({ size: [W, H], format, usage: texUsage });
    let currentOutput = texA;
    let nextOutput = texB;

    // If inputColor is provided, fill the first texture with that color
    if (config.inputColor) {
      const [r, g, b, a] = config.inputColor;
      const pixelData = new Uint8Array(W * H * 4);
      for (let i = 0; i < W * H; i++) {
        pixelData[i * 4 + 0] = Math.round(r * 255);
        pixelData[i * 4 + 1] = Math.round(g * 255);
        pixelData[i * 4 + 2] = Math.round(b * 255);
        pixelData[i * 4 + 3] = Math.round((a !== undefined ? a : 1) * 255);
      }
      device.queue.writeTexture(
        { texture: currentOutput },
        pixelData,
        { bytesPerRow: W * 4 },
        { width: W, height: H },
      );
    }

    let lastHost = null;
    let allConsoleLogs = [];

    // Allocate a dedicated trace texture per traced step so the
    // intermediate value survives whatever ping-pong / fused dispatch
    // happens later in the chain. For fused middle stages the
    // dispatcher writes here directly; for standalone stages or the
    // last stage of a fused run we copy from the ping-pong target
    // after the work runs.
    const traceSteps = config.traceSteps || [];
    const traceTextures = new Map();   // stepIdx → GPUTexture
    const traceTextureHandles = new Map(); // stepIdx → injected handle
    for (const stepIdx of traceSteps) {
      const tex = device.createTexture({ size: [W, H], format, usage: texUsage });
      traceTextures.set(stepIdx, tex);
      traceTextureHandles.set(stepIdx, gpuHost.injectTexture(tex));
    }

    // Accumulator for an in-progress fused run (multi-stage). Stages
    // are appended as we walk the chain; flushed (one combined
    // dispatch) when the next step is non-fusable or the chain ends.
    // Per-stage texture swaps are SKIPPED while accumulating — the
    // dispatcher only ever writes to one output texture per run, so
    // ping-ponging mid-run would alias input and output.
    //
    // perStage carries each step's index (so flush can decide which
    // mid-run stages need a trace-texture binding). The stepIdx of
    // the LAST stage in a run gets its trace via copyTexture from
    // nextOutput post-flush, mirroring the standalone path.
    let runAcc = null;
    // Count of fused-group dispatches that actually combined 2+ stages into a
    // single kernel (a lone fusion-eligible stage still routes through the
    // dispatcher in force-on for parity, but isn't a "fusion" in the sense the
    // executor's planner means — so it doesn't count). Mirrors the native
    // SketchExecutor::fusedRunCount semantics (group.fused == end>start) so
    // `fusedRuns` is the same cross-backend signal: did real fusion happen.
    let fusedRuns = 0;
    const copyToTrace = (srcTex, stepIdx) => {
      const dst = traceTextures.get(stepIdx);
      if (!dst) return;
      const enc = device.createCommandEncoder();
      enc.copyTextureToTexture(
        { texture: srcTex }, { texture: dst }, { width: W, height: H });
      device.queue.submit([enc.finish()]);
    };
    const flushFusedRun = () => {
      if (!runAcc) return;
      const acc = runAcc;
      runAcc = null;
      // Build dispatcher trace handles for any traced NON-LAST stage.
      let perStageTraceHandles;
      let anyTraced = false;
      if (acc.stages.length > 1) {
        perStageTraceHandles = [];
        for (let i = 0; i < acc.stages.length - 1; i++) {
          const stepIdx = acc.perStage[i].stepIdx;
          if (traceSteps.includes(stepIdx)) {
            perStageTraceHandles.push(traceTextureHandles.get(stepIdx));
            anyTraced = true;
          } else {
            perStageTraceHandles.push(null);
          }
        }
      }
      fusionDispatcher.dispatch(
        acc.stages, acc.inputHandle, acc.outputHandle, W, H,
        anyTraced ? perStageTraceHandles : undefined);
      if (acc.stages.length >= 2) fusedRuns++;
      // The dispatch wrote to nextOutput (currentOutput pre-swap).
      // If the run's LAST stage is traced, snapshot from nextOutput
      // (its trace texture mirrors the run's outputHandle).
      const lastStepIdx = acc.perStage[acc.perStage.length - 1].stepIdx;
      if (traceSteps.includes(lastStepIdx)) {
        copyToTrace(nextOutput, lastStepIdx);
      }
      // Swap so the following stage reads the dispatched result.
      const tmp = currentOutput;
      currentOutput = nextOutput;
      nextOutput = tmp;
    };

    for (let si = 0; si < steps.length; si++) {
      const step = steps[si];

      // Set up surface for this step's output
      gpuHost.setSurface(nextOutput, W, H);

      const wasmHost = new WasmHost();
      wasmHost.gpuHost = gpuHost;

      // Texture binding is deferred until we know whether the stage
      // is fused or standalone — for a standalone stage that follows
      // an in-progress fused run, the input/output ping-pong only
      // settles AFTER flushFusedRun swaps. Injecting before the
      // decision would point at the pre-flush textures and read stale
      // input. Each branch below does its own injectTexture +
      // textureFields.set at the right moment.

      await wasmHost.load(`wasm/${config.bundle || 'testonly'}.wasm`);
      const effectId = resolveEffectId(step.module);
      const wasmModule = wasmHost.activateEffect(effectId);

      // Set parameters. Each entry is `[indexOrName, value]`:
      //   - number indexOrName  → legacy: look up scalar param by index in
      //                            wasmHost.params and patch by its name.
      //   - string indexOrName  → direct schema-field patch by name (use
      //                            this for vec / color params, which
      //                            aren't in the legacy params[] list).
      // value may be a number (scalar) or an array (vec / color).
      if (step.params) {
        for (const [indexOrName, value] of step.params) {
          let path;
          if (typeof indexOrName === 'string') {
            path = indexOrName;
          } else {
            const param = wasmHost.params.find(p => p.index === indexOrName);
            path = param?.name ?? String(indexOrName);
            // Mirror legacy frameState.params[] for back-compat with
            // anything that reads the indexed array.
            if (typeof value === 'number') wasmHost.frameState.params[indexOrName] = value;
          }
          wasmHost.notifyStatePatched(wasmModule, [
            { op: 'replace', path, value },
          ]);
        }
      }

      wasmHost.frameState.viewportW = W;
      wasmHost.frameState.viewportH = H;
      wasmHost.frameState.bpm = 120;

      // Multi-frame GPU effects (persistent compute state — e.g.
      // source.light.side_jet's 1D axial solver) accumulate their field across
      // rendered frames. The default path ticks N times then renders
      // once, which only advances such state a single frame. With
      // renderEachTick we interleave tick()+render() so the field
      // develops. Standalone (non-fused) single-effect path only.
      if (config.renderEachTick) {
        let inputHandle = -1;
        if (si > 0 || config.inputColor) {
          inputHandle = gpuHost.injectTexture(currentOutput);
          wasmHost.inputTextureHandles = [inputHandle];
          wasmHost.textureFields.set('tex_in', inputHandle);
        }
        const outputHandle = gpuHost.injectTexture(nextOutput);
        wasmHost.textureFields.set('tex_out', outputHandle);
        const n = Math.max(step.ticks || 1, 1);
        for (let i = 0; i < n; i++) {
          wasmHost.frameState.elapsedTime = (i + 1) * 0.016;
          wasmHost.frameState.deltaTime = 0.016;
          wasmHost.frameState.barPhase = ((i + 1) * 0.016 * 120 / 60 / 4) % 1.0;
          wasmModule.tick(0.016);
          wasmModule.render(W, H);
        }
        if (traceSteps.includes(si)) copyToTrace(nextOutput, si);
        const tmp = currentOutput; currentOutput = nextOutput; nextOutput = tmp;
        allConsoleLogs.push(...wasmHost.consoleLogs.map(l => l.message));
        lastHost = wasmHost;
        continue;
      }

      const tickCount = step.ticks || 0;
      for (let i = 0; i < tickCount; i++) {
        wasmHost.frameState.elapsedTime = (i + 1) * 0.016;
        wasmHost.frameState.deltaTime = 0.016;
        wasmHost.frameState.barPhase = ((i + 1) * 0.016 * 120 / 60 / 4) % 1.0;
        wasmModule.tick(0.016);
      }

      // Fused vs standalone branch.
      //
      // - 'force-on' / 'auto': fusable stages join an accumulator and
      //   dispatch as one combined compute pass when the run breaks.
      //   force-on additionally pushes single-stage runs through the
      //   dispatcher so per-effect tests verify fused-path parity.
      // - 'force-off': every step takes the standalone render() path.
      //
      // fusionKind/fragmentWgsl/uniformBufferHandle are populated by
      // the effect's init() when it calls state::registerFusion.
      // Mappers (kind=1) need an upstream input texture; strict-output
      // generators (kind=2) don't, and they always start a new run.
      const isMapperKind = wasmHost.fusionKind === 1;
      const isStrictOutKind = wasmHost.fusionKind === 2;
      const stageFusable =
        wasmHost.fusionKind > 0
        && (!!wasmHost.fusionFragmentWgsl || !!wasmHost.fusionFragmentName)
        && wasmHost.fusionUniformBufferHandle > 0
        && (isStrictOutKind || (isMapperKind && (si > 0 || !!config.inputColor)));
      if (fusionMode !== 'force-off' && stageFusable) {
        // Inject pre-flush textures: the dispatcher will read from
        // currentOutput (matches the run's chained input, when the
        // top is a mapper) and write to nextOutput (the run's
        // destination). For strict-output tops the inputHandle is
        // unused — pass -1 so a missing input doesn't get silently
        // bound to the wrong texture.
        const inputHandle = isStrictOutKind ? -1 : gpuHost.injectTexture(currentOutput);
        const outputHandle = gpuHost.injectTexture(nextOutput);
        wasmHost.firePrepare(W, H);
        const stage = {
          effectId: resolveEffectId(step.module),
          fusionKind: wasmHost.fusionKind,
          fragmentWgsl: wasmHost.getFusionFragmentWgsl(),
          uniformBufferHandle: wasmHost.fusionUniformBufferHandle,
        };
        // Strict-output always starts a new run — flush whatever
        // was in progress so it ends up the top of its own run.
        if (isStrictOutKind && runAcc) {
          flushFusedRun();
        }
        const stageRecord = { stepIdx: si };
        if (!runAcc) {
          runAcc = {
            stages: [stage],
            perStage: [stageRecord],
            inputHandle, outputHandle,
          };
        } else {
          runAcc.stages.push(stage);
          runAcc.perStage.push(stageRecord);
          runAcc.outputHandle = outputHandle;
        }
        // Skip the per-step swap — the dispatcher writes once per run.
      } else {
        // Stage breaks an in-progress fused run — flush first so the
        // ping-pong textures are in the right state for render(),
        // then inject post-flush textures so render() reads the
        // dispatched output.
        flushFusedRun();
        let inputHandle = -1;
        if (si > 0 || config.inputColor) {
          inputHandle = gpuHost.injectTexture(currentOutput);
          wasmHost.inputTextureHandles = [inputHandle];
          wasmHost.textureFields.set('tex_in', inputHandle);
        }
        const outputHandle = gpuHost.injectTexture(nextOutput);
        wasmHost.textureFields.set('tex_out', outputHandle);
        wasmModule.render(W, H);
        // Snapshot to trace texture if requested. This step ran
        // standalone, so its post-step pixels are in nextOutput
        // before the swap.
        if (traceSteps.includes(si)) {
          copyToTrace(nextOutput, si);
        }
        // Swap for this standalone step.
        const tmp = currentOutput;
        currentOutput = nextOutput;
        nextOutput = tmp;
      }
      allConsoleLogs.push(...wasmHost.consoleLogs.map(l => l.message));
      lastHost = wasmHost;
    }

    // Chain end — dispatch any pending fused run so currentOutput is real.
    flushFusedRun();

    // currentOutput has the final result
    const finalHandle = gpuHost.injectTexture(currentOutput);
    const pixels = await gpuHost.readbackTexture(finalHandle, W, H);

    const points = (config.samplePoints && config.samplePoints.length > 0)
      ? config.samplePoints
      : [[W/2, H/2], [0, 0], [W-1, 0], [0, H-1], [W-1, H-1]];

    const samples = points.map(([x, y]) => {
      x = Math.floor(x); y = Math.floor(y);
      const o = (y * W + x) * 4;
      return { x, y, r: pixels[o], g: pixels[o+1], b: pixels[o+2], a: pixels[o+3] };
    });

    let pixelsBase64 = '';
    if (config.dumpPixels !== false) {
      const chunks = [];
      for (let i = 0; i < pixels.length; i += 8192) {
        chunks.push(String.fromCharCode.apply(null, pixels.subarray(i, Math.min(i + 8192, pixels.length))));
      }
      pixelsBase64 = btoa(chunks.join(''));
    }

    // Read back any per-step trace textures the test asked for.
    // These let assertions inspect mid-fused-run pixel values without
    // breaking the natural ping-pong pattern.
    const tracePixelsBase64 = {};
    for (const stepIdx of traceSteps) {
      const handle = traceTextureHandles.get(stepIdx);
      if (handle == null) continue;
      const tracePixels = await gpuHost.readbackTexture(handle, W, H);
      const chunks = [];
      for (let i = 0; i < tracePixels.length; i += 8192) {
        chunks.push(String.fromCharCode.apply(null, tracePixels.subarray(i, Math.min(i + 8192, tracePixels.length))));
      }
      tracePixelsBase64[stepIdx] = btoa(chunks.join(''));
    }

    resultEl.textContent = JSON.stringify({
      success: true,
      width: W, height: H,
      pixelCount: pixels.length / 4,
      samples, pixelsBase64,
      tracePixelsBase64,
      fusedRuns,
      // Fusion class the LAST effect declared (state::FusionKind: 0=Freeform,
      // 1=PerPixelMapper, 2=StrictOutput). For a single-effect run this is the
      // effect under test. Mirrors the native runner's `fusionKind`.
      fusionKind: lastHost?.fusionKind ?? 0,
      consoleLog: allConsoleLogs,
      gpuErrors: captured,
      pluginState: lastHost?.pluginState ?? {},
      metadata: lastHost?.metadata ?? null,
      params: lastHost?.params ?? [],
    }, null, 2);
  } catch (e) {
    resultEl.textContent = JSON.stringify({ success: false, error: String(e), stack: e.stack }, null, 2);
  }
}

window.__gpuTestRun = run;
if (window.__gpuTestConfig) {
  run();
} else if (new URLSearchParams(window.location.search).has('module')) {
  run();
}
</script>
</body>
</html>
