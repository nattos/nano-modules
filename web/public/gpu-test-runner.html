<!DOCTYPE html>
<html>
<head><title>GPU Test Runner</title></head>
<body>
<pre id="result">Waiting for test config...</pre>
<script type="module">
import { GPUHost } from '/src/gpu-host.ts';
import { WasmHost } from '/src/wasm-host.ts';
import { FusionDispatcher } from '/src/fusion-dispatcher.ts';

/*
 * Generic GPU module test runner.
 *
 * Config shape (single module):
 * {
 *   module: "gpu_test.wasm",
 *   width: 64, height: 64,
 *   params: [[0, 0.5], [1, 1.0]],
 *   ticks: 1,
 *   samplePoints: [[32,32]],
 *   inputColor: [r, g, b, a],  // optional: create solid input texture
 * }
 *
 * Config shape (chain):
 * {
 *   chain: [
 *     { module: "spinningtris.wasm", params: [[0, 0.5]], ticks: 5 },
 *     { module: "brightness_contrast.wasm", params: [[1, 0.25]] },
 *   ],
 *   width: 64, height: 64,
 *   samplePoints: [[32,32]],
 * }
 */

// This GPU test runner loads the `testonly.wasm` bundle, which contains
// every effect the integration tests rely on. Tests still name modules by
// the old standalone .wasm filename (e.g. "gpu_test.wasm") for back-compat;
// translate those to the corresponding registered effect ID inside the
// bundle.
const EFFECT_ID_BY_FILENAME = {
  'gpu_test.wasm': 'debug.gpu_test',
  'spinningtris.wasm': 'generator.spinningtris',
  'brightness_contrast.wasm': 'video.brightness_contrast',
  'solid_color.wasm': 'generator.solid_color',
  'video_blend.wasm': 'video.blend',
  'env_lfo.wasm': 'data.lfo',
  // Wave-1 + Wave-2 core effects.
  'bake_alpha.wasm': 'video.bake_alpha',
  'curve.wasm': 'video.curve',
  'exposure.wasm': 'video.exposure',
  'invert.wasm': 'video.invert',
  'posterize.wasm': 'video.posterize',
  'levels.wasm': 'video.levels',
  'hsl.wasm': 'video.hsl',
  'color_space.wasm': 'video.color_space',
  'hue_basis.wasm': 'video.hue_basis',
  'saturate.wasm': 'video.saturate',
  'vibrance.wasm': 'video.vibrance',
  'vignette.wasm': 'video.vignette',
  'blur.wasm': 'video.blur',
  'fast_blur.wasm': 'video.fast_blur',
  'sharpen.wasm': 'video.sharpen',
  'edges.wasm': 'video.edges',
  'crop.wasm': 'video.crop',
  'transform.wasm': 'video.transform',
  'gradient.wasm': 'generator.gradient',
  'grid.wasm': 'generator.grid',
  'noise.wasm': 'generator.noise',
  // Test-only fusion-aware mappers (testonly bundle only).
  'fuse_add.wasm': 'debug.fuse_add',
  'fuse_mul.wasm': 'debug.fuse_mul',
  // Platform-feature smoke effects (testonly bundle only).
  'hdr_test.wasm': 'debug.hdr_test',
  'atomic_test.wasm': 'debug.atomic_test',
  'rw_storage_test.wasm': 'debug.rw_storage_test',
  'clear_copy_test.wasm': 'debug.clear_copy_test',
  'mrt_test.wasm': 'debug.mrt_test',
  'lut3d_test.wasm': 'debug.lut3d_test',
};

function resolveEffectId(moduleName) {
  // Accept either an effect ID (e.g. "debug.gpu_test") or a legacy filename.
  if (EFFECT_ID_BY_FILENAME[moduleName]) return EFFECT_ID_BY_FILENAME[moduleName];
  if (moduleName.endsWith('.wasm')) {
    const bare = moduleName.replace(/\.wasm$/, '');
    return EFFECT_ID_BY_FILENAME[bare + '.wasm'] ?? bare;
  }
  return moduleName;
}

async function run() {
  const resultEl = document.getElementById('result');
  resultEl.textContent = 'Running...';

  const config = window.__gpuTestConfig || (() => {
    const p = new URLSearchParams(window.location.search);
    return {
      module: p.get('module') || 'gpu_test.wasm',
      width: parseInt(p.get('width') || '64'),
      height: parseInt(p.get('height') || '64'),
      params: JSON.parse(p.get('params') || '[]'),
      ticks: parseInt(p.get('ticks') || '0'),
      samplePoints: JSON.parse(p.get('samples') || '[]'),
    };
  })();

  const W = config.width || 64;
  const H = config.height || 64;

  try {
    const adapter = await navigator.gpu?.requestAdapter();
    if (!adapter) throw new Error('No GPU adapter');
    const device = await adapter.requestDevice();
    const captured = [];
    device.addEventListener?.('uncapturederror', e => {
      captured.push(String(e.error?.message || e.error));
    });
    window.__gpuTestErrors = captured;
    const format = 'rgba8unorm';
    const texUsage = GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING
                   | GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.COPY_SRC
                   | GPUTextureUsage.COPY_DST;

    const gpuHost = new GPUHost(device, format);

    // Fusion dispatcher used when the test config requests
    // force-on fusion mode — every per-step dispatch goes through the
    // composer so per-effect tests can verify byte-identity between
    // the standalone and fused paths.
    const fusionDispatcher = new FusionDispatcher(gpuHost);
    const fusionMode = config.fusionMode || 'auto';

    // Build chain: either explicit chain config, or single module
    const steps = config.chain || [{
      module: config.module,
      params: config.params,
      ticks: config.ticks,
    }];

    // Create textures for ping-pong between steps
    const texA = device.createTexture({ size: [W, H], format, usage: texUsage });
    const texB = device.createTexture({ size: [W, H], format, usage: texUsage });
    let currentOutput = texA;
    let nextOutput = texB;

    // If inputColor is provided, fill the first texture with that color
    if (config.inputColor) {
      const [r, g, b, a] = config.inputColor;
      const pixelData = new Uint8Array(W * H * 4);
      for (let i = 0; i < W * H; i++) {
        pixelData[i * 4 + 0] = Math.round(r * 255);
        pixelData[i * 4 + 1] = Math.round(g * 255);
        pixelData[i * 4 + 2] = Math.round(b * 255);
        pixelData[i * 4 + 3] = Math.round((a !== undefined ? a : 1) * 255);
      }
      device.queue.writeTexture(
        { texture: currentOutput },
        pixelData,
        { bytesPerRow: W * 4 },
        { width: W, height: H },
      );
    }

    let lastHost = null;
    let allConsoleLogs = [];

    // Accumulator for an in-progress fused run (multi-stage). Stages
    // are appended as we walk the chain; flushed (one combined
    // dispatch) when the next step is non-fusable or the chain ends.
    // Per-stage texture swaps are SKIPPED while accumulating — the
    // dispatcher only ever writes to one output texture per run, so
    // ping-ponging mid-run would alias input and output.
    let runAcc = null;
    const flushFusedRun = () => {
      if (!runAcc) return;
      fusionDispatcher.dispatch(
        runAcc.stages, runAcc.inputHandle, runAcc.outputHandle, W, H);
      runAcc = null;
      // The dispatch wrote to nextOutput (currentOutput pre-swap).
      // Swap so the following stage reads the dispatched result.
      const tmp = currentOutput;
      currentOutput = nextOutput;
      nextOutput = tmp;
    };

    for (let si = 0; si < steps.length; si++) {
      const step = steps[si];

      // Set up surface for this step's output
      gpuHost.setSurface(nextOutput, W, H);

      const wasmHost = new WasmHost();
      wasmHost.gpuHost = gpuHost;

      // Texture binding is deferred until we know whether the stage
      // is fused or standalone — for a standalone stage that follows
      // an in-progress fused run, the input/output ping-pong only
      // settles AFTER flushFusedRun swaps. Injecting before the
      // decision would point at the pre-flush textures and read stale
      // input. Each branch below does its own injectTexture +
      // textureFields.set at the right moment.

      await wasmHost.load(`wasm/${config.bundle || 'testonly'}.wasm`);
      const effectId = resolveEffectId(step.module);
      const wasmModule = wasmHost.activateEffect(effectId);

      // Set parameters. Each entry is `[indexOrName, value]`:
      //   - number indexOrName  → legacy: look up scalar param by index in
      //                            wasmHost.params and patch by its name.
      //   - string indexOrName  → direct schema-field patch by name (use
      //                            this for vec / color params, which
      //                            aren't in the legacy params[] list).
      // value may be a number (scalar) or an array (vec / color).
      if (step.params) {
        for (const [indexOrName, value] of step.params) {
          let path;
          if (typeof indexOrName === 'string') {
            path = indexOrName;
          } else {
            const param = wasmHost.params.find(p => p.index === indexOrName);
            path = param?.name ?? String(indexOrName);
            // Mirror legacy frameState.params[] for back-compat with
            // anything that reads the indexed array.
            if (typeof value === 'number') wasmHost.frameState.params[indexOrName] = value;
          }
          wasmHost.notifyStatePatched(wasmModule, [
            { op: 'replace', path, value },
          ]);
        }
      }

      wasmHost.frameState.viewportW = W;
      wasmHost.frameState.viewportH = H;
      wasmHost.frameState.bpm = 120;

      const tickCount = step.ticks || 0;
      for (let i = 0; i < tickCount; i++) {
        wasmHost.frameState.elapsedTime = (i + 1) * 0.016;
        wasmHost.frameState.deltaTime = 0.016;
        wasmHost.frameState.barPhase = ((i + 1) * 0.016 * 120 / 60 / 4) % 1.0;
        wasmModule.tick(0.016);
      }

      // Fused vs standalone branch.
      //
      // - 'force-on' / 'auto': fusable stages join an accumulator and
      //   dispatch as one combined compute pass when the run breaks.
      //   force-on additionally pushes single-stage runs through the
      //   dispatcher so per-effect tests verify fused-path parity.
      // - 'force-off': every step takes the standalone render() path.
      //
      // fusionKind/fragmentWgsl/uniformBufferHandle are populated by
      // the effect's init() when it calls state::registerFusion.
      const stageFusable =
        wasmHost.fusionKind > 0
        && !!wasmHost.fusionFragmentWgsl
        && wasmHost.fusionUniformBufferHandle > 0
        && (si > 0 || !!config.inputColor);  // need an input texture
      if (fusionMode !== 'force-off' && stageFusable) {
        // Inject pre-flush textures: the dispatcher will read from
        // currentOutput (matches the run's chained input) and write
        // to nextOutput (the run's destination). Repeated injects
        // across stages in the same run are harmless — just extra
        // handles pointing at the same two textures.
        const inputHandle = gpuHost.injectTexture(currentOutput);
        const outputHandle = gpuHost.injectTexture(nextOutput);
        wasmHost.firePrepare(W, H);
        const stage = {
          effectId: resolveEffectId(step.module),
          fusionKind: wasmHost.fusionKind,
          fragmentWgsl: wasmHost.fusionFragmentWgsl,
          uniformBufferHandle: wasmHost.fusionUniformBufferHandle,
        };
        if (!runAcc) {
          runAcc = { stages: [stage], inputHandle, outputHandle };
        } else {
          runAcc.stages.push(stage);
          runAcc.outputHandle = outputHandle;
        }
        // Skip the per-step swap — the dispatcher writes once per run.
      } else {
        // Stage breaks an in-progress fused run — flush first so the
        // ping-pong textures are in the right state for render(),
        // then inject post-flush textures so render() reads the
        // dispatched output.
        flushFusedRun();
        let inputHandle = -1;
        if (si > 0 || config.inputColor) {
          inputHandle = gpuHost.injectTexture(currentOutput);
          wasmHost.inputTextureHandles = [inputHandle];
          wasmHost.textureFields.set('tex_in', inputHandle);
        }
        const outputHandle = gpuHost.injectTexture(nextOutput);
        wasmHost.textureFields.set('tex_out', outputHandle);
        wasmModule.render(W, H);
        // Swap for this standalone step.
        const tmp = currentOutput;
        currentOutput = nextOutput;
        nextOutput = tmp;
      }
      allConsoleLogs.push(...wasmHost.consoleLogs.map(l => l.message));
      lastHost = wasmHost;
    }

    // Chain end — dispatch any pending fused run so currentOutput is real.
    flushFusedRun();

    // currentOutput has the final result
    const finalHandle = gpuHost.injectTexture(currentOutput);
    const pixels = await gpuHost.readbackTexture(finalHandle, W, H);

    const points = (config.samplePoints && config.samplePoints.length > 0)
      ? config.samplePoints
      : [[W/2, H/2], [0, 0], [W-1, 0], [0, H-1], [W-1, H-1]];

    const samples = points.map(([x, y]) => {
      x = Math.floor(x); y = Math.floor(y);
      const o = (y * W + x) * 4;
      return { x, y, r: pixels[o], g: pixels[o+1], b: pixels[o+2], a: pixels[o+3] };
    });

    let pixelsBase64 = '';
    if (config.dumpPixels !== false) {
      const chunks = [];
      for (let i = 0; i < pixels.length; i += 8192) {
        chunks.push(String.fromCharCode.apply(null, pixels.subarray(i, Math.min(i + 8192, pixels.length))));
      }
      pixelsBase64 = btoa(chunks.join(''));
    }

    resultEl.textContent = JSON.stringify({
      success: true,
      width: W, height: H,
      pixelCount: pixels.length / 4,
      samples, pixelsBase64,
      consoleLog: allConsoleLogs,
      gpuErrors: captured,
      pluginState: lastHost?.pluginState ?? {},
      metadata: lastHost?.metadata ?? null,
      params: lastHost?.params ?? [],
    }, null, 2);
  } catch (e) {
    resultEl.textContent = JSON.stringify({ success: false, error: String(e), stack: e.stack }, null, 2);
  }
}

window.__gpuTestRun = run;
if (window.__gpuTestConfig) {
  run();
} else if (new URLSearchParams(window.location.search).has('module')) {
  run();
}
</script>
</body>
</html>
