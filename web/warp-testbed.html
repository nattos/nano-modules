<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beat Warp Testbed</title>
  <link rel="stylesheet" href="src/style.css" />
  <style>
    body { margin: 0; font-family: 'JetBrains Mono', monospace; background: #121418; color: #e6e6e6; padding: 16px; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    button { background: #1a1d24; color: #e6e6e6; border: 1px solid #2a2e38; padding: 6px 12px; font-family: inherit; cursor: pointer; }
    button.on { border-color: #A07CE0; color: #A07CE0; }
    canvas { border: 1px solid #2a2e38; display: block; background: #0e1014; }
    .muted { color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <h2>Beat Warp Testbed <span class="muted">— offline warp curve: grid clumping + beat⇄seconds clock (window.__warp)</span></h2>
  <div class="row">
    <button id="toggle">Warp: on</button>
    <span id="status" class="muted"></span>
  </div>
  <canvas id="c" width="820" height="260"></canvas>
  <p class="muted">Top: warped beat grid (violet = bars). Bottom: secondsAt(beat) — straight under no warp,
    wavy under warp. Same <code>WarpCurve</code> drives both the grid and the seek clock.</p>
  <script type="module" src="src/warp-testbed.ts"></script>
</body>
</html>
