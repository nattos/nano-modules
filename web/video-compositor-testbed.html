<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Video Compositor Testbed</title>
    <style>
      body { margin: 0; background: #111; color: #ddd; font-family: monospace; }
      .stage { position: relative; width: 640px; height: 360px;
        background-color: #777;
        background-image:
          linear-gradient(45deg, #999 25%, transparent 25%),
          linear-gradient(-45deg, #999 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #999 75%),
          linear-gradient(-45deg, transparent 75%, #999 75%);
        background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #bar { padding: 8px; display: flex; gap: 8px; align-items: center; }
      button { font-family: inherit; }
    </style>
  </head>
  <body>
    <div id="bar">
      <button id="red">Inject RED</button>
      <button id="green">Inject GREEN</button>
      <button id="dxv">Load DXV video</button>
      <span id="status">booting…</span>
    </div>
    <div class="stage"><canvas id="mon"></canvas></div>
    <script type="module" src="/src/video-compositor-testbed.ts"></script>
  </body>
</html>
